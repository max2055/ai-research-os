[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-research-os"
version = "0.2.0"
description = "Local-first, evidence-traceable AI industry research operating system"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Private" }
authors = [{ name = "Max" }]
dependencies = [
  "pydantic>=2.10,<3",
  "pypdf>=5,<7",
  "ruamel.yaml>=0.18,<0.19",
  "typer>=0.15,<1",
  "apscheduler>=3.11,<4",
]

[project.optional-dependencies]
ui = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
]
dev = [
  "coverage[toml]>=7.6,<8",
  "httpx2>=2.9,<3",
  "mypy>=1.14,<2",
  "pytest>=8,<9",
  "pytest-cov>=6,<8",
  "ruff>=0.9,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
research_os = ["ui/*.css"]

[tool.pytest.ini_options]
testpaths = ["09_Automation/tests", "tests"]
addopts = "-q"
markers = [
  "local_integration: requires explicit local operational state via environment",
]

[tool.coverage.run]
branch = true
source = ["research_os"]

[tool.coverage.report]
show_missing = true
fail_under = 80
omit = [
  "src/research_os/__main__.py",
  "src/research_os/ui/__main__.py",
  "src/research_os/cli.py",
  "src/research_os/legacy_core.py",
]

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src", "09_Automation/tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"09_Automation/research_os.py" = ["E402"]
"09_Automation/research_os_core.py" = ["E402", "F403"]
"09_Automation/tests/*.py" = ["E402"]
"src/research_os/ui/app.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["research_os"]
